<html lang="en">

<head>
    <title>Grey Castle Productions</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width initial-scale=1 minimum-scale=1" />
    <link rel="icon" href="icon.png" type="image/x-icon" />
    <link rel="stylesheet" href="styles.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Quicksand:wght@300..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <a href="/" id="logo-link">
        <img id="logo" src="GCP.png" alt="all caps logo of Grey Castle Productions">
    </a>
    <button id="menu-button" alt="open menu"></button>
    <div id="menu" class="invisible">
        <a href="./projects">
            <h3>Current Projects</h3>
        </a>
        <a href="./about">
            <h3>About</h3>
        </a>
        <a href="./contact">
            <h3>Contact</h3>
        </a>
    </div>
    <script>
        const menu = document.getElementById("menu");
        const menuButton = document.getElementById("menu-button");

        menuButton.onclick = () => {
            menu.classList.contains("invisible") ?
                menu.classList.remove("invisible") :
                menu.classList.add("invisible")
        }
    </script>

    <header>
        <img src="./assets/small/itwgin-lead.jpg" id="itwgin">
        <img src="./assets/small/rhl-lead.jpg" id="rhl">
        <img src="./assets/small/two-tribes-lead.jpg" id="two-tribes">
        <img src="./assets/small/lenny-lead.jpg" id="lenny">
    </header>



    <h2 id="slogan">New-writing Platforming Queer Stories</h2>

</body>

</html>
