<html lang="en">

<head>
    <title>Grey Castle Productions</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width initial-scale=1 minimum-scale=1" />
    <link rel="icon" href="../icon.png" type="image/x-icon" />
    <link rel="stylesheet" href="../styles.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Quicksand:wght@300..700&display=swap"
        rel="stylesheet">
</head>

<body id="projects">
    <a href="/" id="logo-link">
        <img id="logo" src="../GCP.png" alt="all caps logo of Grey Castle Productions">
    </a>
    <button id="menu-button" alt="open menu"></button>
    <div id="menu" class="invisible">
        <a href="../projects">
            <h3>Projects</h3>
        </a>
        <a href="../engagements">
            <h3>Engagements</h3>
        </a>
        <a href="../about">
            <h3>About</h3>
        </a>
        <a href="../contact">
            <h3>Contact</h3>
        </a>
    </div>
    <script>
        const menu = document.getElementById("menu");
        const menuButton = document.getElementById("menu-button");

        menuButton.onclick = () => {
            menu.classList.contains("invisible") ?
                menu.classList.remove("invisible") :
                menu.classList.add("invisible")
        }
    </script>

    <img class="about" src="../assets/small/positive-stage.jpg">

    <h2>Engagements</h2>

    <h4>Projects Grey Castle Productions were engaged to produce.</h4>

    <a href="./all-of-them-dead">
        <div class="project-container">
            <img src="../assets/small/all-of-them-dead-lead.jpg">
            <p>2025</p>
            <h2 class="project-title">All of Them, Dead</h2>
            <h3>Thom Munden</h3>
        </div>
    </a>

    <a href="./positive">
        <div class="project-container">
            <img src="../assets/small/positive-lead.jpg">
            <p>2025</p>
            <h2 class="project-title">Positive</h2>
            <h3>Temi Majekodunmi</h3>
        </div>
    </a>

    <footer>
        <p>Grey Castle Productions</p>
        <p>&copy; 2026 All Rights Reserved</p>
    </footer>

</body>

</html>
